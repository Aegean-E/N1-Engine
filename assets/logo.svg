<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" data-motif="atom" data-layout="left">
  <title id="title">N1 Engine logo</title>
  <desc id="desc">Project-specific atom mark for N1 Engine; AegeanWorks identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1a"/><stop offset="1" stop-color="#241b4a"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="238" r="164" fill="none" stroke="#f0abfc" stroke-opacity="0.18" stroke-width="2"/>
  <g transform="translate(256 232) scale(1.62)" opacity="1.0"><ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="#f0abfc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="58" ry="22" transform="rotate(60)" fill="none" stroke="#f0abfc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="58" ry="22" transform="rotate(120)" fill="none" stroke="#f0abfc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="9" fill="#67e8f9"/></g>
  <text x="256" y="404" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#mark)" letter-spacing="3">NE</text>
  <text x="256" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#F8FAFC" fill-opacity="0.55">AEGEANWORKS</text>
</svg>
